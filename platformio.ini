; PlatformIO Project Configuration File
;
; The sketch stays in the repo root so it still opens in the Arduino IDE.
;
;   pio run                        Build
;   pio run -e uart -t upload      Upload through the serial bootloader
;   pio run -e isp -t bootloader   Burn bootloader and fuses with the ISP programmer
;   pio run -e isp -t upload       Upload with the ISP programmer (erases the bootloader)
;   pio run -e usbtiny -t bootloader -t upload   Bootloader, fuses and sketch with the Pocket AVR Programmer
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = ./
include_dir = ./
default_envs = uart

; ATmega328P on the internal 8 MHz oscillator (PB6/PB7 drive the display, so
; there is no crystal), using the MiniCore Arduino core and urboot bootloader.
; The internal oscillator is only accurate to a few percent, so the bootloader
; baud rate is kept low.
[env]
platform = atmelavr
board = ATmega328P
framework = arduino
board_build.f_cpu = 8000000L
board_hardware.oscillator = internal
board_hardware.uart = uart0
board_hardware.bod = 2.7v
board_hardware.eesave = yes
board_upload.speed = 38400
board_bootloader.speed = 38400
build_src_filter = +<*.ino> +<*.cpp>
lib_deps =
	adafruit/Adafruit NeoPixel@^1.12.3
monitor_speed = 38400

; Serial bootloader on PD0/PD1. The board has no auto-reset, so press the reset
; button when the upload starts
[env:uart]
upload_protocol = urclock

; Arduino as ISP (ArduinoISP sketch) on the 2x3 header. The bootloader and
; fuse commands don't add the port and speed themselves, so they are passed in
; upload_flags. A clone with a CH340 shows up as /dev/ttyUSB0 instead.
[env:isp]
upload_protocol = stk500v1
upload_port = /dev/ttyACM0
upload_speed = 19200
upload_flags =
	-P$UPLOAD_PORT
	-b$UPLOAD_SPEED
	-e

; SparkFun Pocket AVR Programmer (USBtiny) on the 2x3 header. Set its switch to
; "No Power" when the board is powered from USB-C. A new chip still running on
; its 1 MHz factory clock needs a slower ISP clock: add "upload_flags = -B32".
; No -e here: "-t bootloader" erases the chip, and "-t upload" then adds the
; sketch next to the bootloader (PlatformIO uploads with -D). To upload again,
; run "-t bootloader" first, since flash can't be rewritten without an erase.
[env:usbtiny]
upload_protocol = usbtiny
